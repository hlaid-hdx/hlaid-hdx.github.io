<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crow Nut Languages</title>

    <link
        href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
        rel="stylesheet"
        type="text/css"
    >

    <link href="style.css" rel="stylesheet" type="text/css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Gravitas+One&family=Oswald&display=swap"
        rel="stylesheet"
        type="text/css"
    >
</head>

<body>
    <header class="container">
        <div class="row">
            <h1 class="col-sm-4">Crow Speak</h1>

            <nav class="col-sm-8 text-right">
                <p>Nuts</p>
                <p>Sightings</p>
                <p>Report</p>
            </nav>
        </div>
    </header>

    <section class="jumbotron">
        <div class="container">
            <div class="row text-center">
                <h2>Crow Translations</h2>
                <h3>Understand your Avians</h3>
                <a class="btn btn-primary" href="#" role="button">Learn more</a>
            </div>
        </div>
    </section>

    <section class="container">
        <div class="row">
            <figure class="col-sm-6">
                <p><strong>The Nuts of Conversation</strong></p>
                <img
                    src="https://images.pexels.com/photos/8705561/pexels-photo-8705561.jpeg"
                    alt="A crow standing near a walnut"
                >
            </figure>

            <figure class="col-sm-6">
                <p>
                    While many people would think that crows communicate vocally,
                    new studies show that they communicate through <strong>NUTS</strong>!
                </p>
                <p>
                    The type of nuts used indicate their mood, sociability, and even
                    can serve as an expression of affection!
                </p>
                <p>
                    Who knows! Maybe a crow is saying they're <i>nuts</i> about you!
                </p>
            </figure>
        </div>
    </section>

    <section class="container">
        <div class="row">
            <figure class="col-sm-6">
                <p><strong>Listen to the Wild</strong></p>
                <img
                    src="https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvcGQxNy0xMDEtbnVtLWNvcnZ1cy1jb3JheC1yYXZlbi5qcGc.jpg"
                    alt="Vintage illustration of a black bird"
                >
            </figure>

            <figure class="col-sm-6">
                <p>
                    While many associate crows, or all black birds for the matter,
                    with bad omens, it's important to remember that they are very
                    sacred animals!
                </p>

                <p>Rather than dismiss them, you should:</p>

                <ul>
                    <li>Respect them and their habitat.</li>
                    <li>Watch attentively to the items that they carry with them or the nuts that they use to communicate.</li>
                    <li>Avoid feeding them food that would not naturally be seen in their diet.</li>
                </ul>
            </figure>
        </div>
    </section>

    <footer class="container">
        <div class="row">
            <p class="col-sm-4">
                &copy;
                <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&amp;list=RDdQw4w9WgXcQ&amp;start_radio=1">
                    2016 NuttyBirdCult
                </a>
            </p>
        </div>
    </footer>
</body>
</html>
